name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "FirebaseLanding/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore LearnHub.sln

      - name: Build (warnings fail the build)
        run: dotnet build LearnHub.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        run: >
          dotnet test
          --solution LearnHub.sln
          --configuration Release
          --no-build
          --results-directory "$GITHUB_WORKSPACE/TestResults"
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx

      - name: Summarise test results
        if: always()
        run: bash scripts/ci/test-summary.sh TestResults test-results.trx "Test results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  # Builds the image Railway builds and runs it the way Railway runs it: Production settings, a PORT chosen by the
  # platform, TLS terminated in front and a volume at /data. This is what catches a broken Dockerfile or a missing
  # migration before a deploy does.
  container:
    name: Railway image, migrations and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the Docker image
        run: docker build --tag learnhub:ci .

      # The password is generated per run and masked, so no credential is stored in the repository.
      - name: Start the container with Railway-like settings
        run: |
          admin_password="Adm$(openssl rand -hex 12)A1"
          echo "::add-mask::$admin_password"
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          docker run --detach --name learnhub \
            --publish 8080:8080 \
            --mount type=volume,source=learnhub-data,target=/data \
            --env PORT=8080 \
            --env Seed__AdminPassword="$admin_password" \
            learnhub:ci

      - name: Wait for the health check
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "LearnHub is healthy."
              exit 0
            fi
            sleep 3
          done
          docker logs learnhub
          exit 1

      - name: Smoke test the container
        run: SMOKE_FORWARDED_PROTO=https bash scripts/smoke-test.sh http://127.0.0.1:8080

      - name: Check the start-up log
        if: always()
        run: |
          docker logs learnhub > "$RUNNER_TEMP/learnhub-container.log" 2>&1 || true
          cat "$RUNNER_TEMP/learnhub-container.log"
          status=0
          grep -q "Applying migration" "$RUNNER_TEMP/learnhub-container.log" \
            || { echo "::error::Migrations were not applied on start-up."; status=1; }
          grep -q "Demo data seeded" "$RUNNER_TEMP/learnhub-container.log" \
            || { echo "::error::Demo data was not seeded."; status=1; }
          grep -q "Administrator account" "$RUNNER_TEMP/learnhub-container.log" \
            || { echo "::error::The administrator account was not created."; status=1; }
          if grep -Eq "^(fail|crit):" "$RUNNER_TEMP/learnhub-container.log"; then
            echo "::error::The application logged errors."
            status=1
          fi
          exit "$status"

      # Anything written to /data survives a restart only because the volume is mounted there: this proves the
      # SQLite file and the Data Protection key ring are genuinely persistent on Railway.
      - name: Restart and confirm the data survived
        run: |
          # Docker keeps the log across a restart, so remember where the first run ended and judge only the new lines.
          before="$(docker logs learnhub 2>&1 | wc -l)"

          docker restart learnhub
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null 2>&1; then break; fi
            sleep 3
          done

          docker logs learnhub 2>&1 | tail -n "+$((before + 1))" > "$RUNNER_TEMP/learnhub-restart.log" || true
          echo "--- log produced by the restart ---"
          cat "$RUNNER_TEMP/learnhub-restart.log"

          status=0
          if grep -q "Applying migration" "$RUNNER_TEMP/learnhub-restart.log"; then
            echo "::error::Migrations ran again after a restart, so the database did not persist."
            status=1
          fi
          if grep -q "Demo data seeded" "$RUNNER_TEMP/learnhub-restart.log"; then
            echo "::error::The catalogue was seeded again after a restart, so the database did not persist."
            status=1
          fi
          if grep -Eq "^(fail|crit):" "$RUNNER_TEMP/learnhub-restart.log"; then
            echo "::error::The application logged errors after the restart."
            status=1
          fi
          if [ "$status" = "0" ]; then
            echo "The database survived the restart: no migration and no seeding ran a second time."
          fi
          exit "$status"

      - name: Upload container log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container
          path: ${{ runner.temp }}/learnhub-*.log
          retention-days: 14

  e2e:
    name: Browser tests (mobile, tablet, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://127.0.0.1:5443
      E2E_ADMIN_EMAIL: admin@learnhub.test
      E2E_STUDENT_EMAIL: demo.student@learnhub.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Generate throw-away test credentials
        run: |
          admin="Adm$(openssl rand -hex 12)A1"
          student="Stu$(openssl rand -hex 12)S1"
          echo "::add-mask::$admin"
          echo "::add-mask::$student"
          echo "E2E_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"
          echo "E2E_STUDENT_PASSWORD=$student" >> "$GITHUB_ENV"

      - name: Publish LearnHub
        run: dotnet publish src/LearnHub/LearnHub.csproj --configuration Release --output "$RUNNER_TEMP/learnhub"

      # Production mode marks cookies Secure-only, so the app is served over HTTPS with a one-day self-signed certificate.
      - name: Start LearnHub over HTTPS with production settings
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/e2e-key.pem" -out "$RUNNER_TEMP/e2e-cert.pem" 2> /dev/null
          log="$RUNNER_TEMP/learnhub-e2e.log"
          (
            cd "$RUNNER_TEMP/learnhub"
            export ASPNETCORE_ENVIRONMENT=Production
            export ASPNETCORE_URLS="$E2E_BASE_URL"
            export Kestrel__Certificates__Default__Path="$RUNNER_TEMP/e2e-cert.pem"
            export Kestrel__Certificates__Default__KeyPath="$RUNNER_TEMP/e2e-key.pem"
            export DATABASE_CONNECTION_STRING="Data Source=$RUNNER_TEMP/learnhub-e2e.db"
            export DataProtection__KeysPath="$RUNNER_TEMP/e2e-keys"
            export Storage__RootPath="$RUNNER_TEMP/storage"
            export Seed__AdminEmail="$E2E_ADMIN_EMAIL"
            export Seed__AdminPassword="$E2E_ADMIN_PASSWORD"
            export Seed__DemoStudentEmail="$E2E_STUDENT_EMAIL"
            export Seed__DemoStudentPassword="$E2E_STUDENT_PASSWORD"
            export RateLimiting__PermitLimit=1000
            nohup dotnet LearnHub.dll > "$log" 2>&1 &
          )
          for attempt in $(seq 1 90); do
            if curl -ksf "$E2E_BASE_URL/health" > /dev/null 2>&1; then
              echo "LearnHub is running."
              exit 0
            fi
            sleep 2
          done
          cat "$log"
          exit 1

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Check the application log for errors
        if: always()
        run: |
          log="$RUNNER_TEMP/learnhub-e2e.log"
          # Kept next to the report so the artifact has one tidy folder structure.
          cp "$log" tests/e2e/app.log 2> /dev/null || true
          if grep -Eq "^(fail|crit):" "$log"; then
            echo "::error::The application logged errors during the browser tests."
            grep -EA20 "^(fail|crit):" "$log"
            exit 1
          fi

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/screenshots
            tests/e2e/playwright-report
            tests/e2e/test-results
            tests/e2e/app.log
          retention-days: 14
