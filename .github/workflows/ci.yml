name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "Documentation/**"
      - "**/*.md"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore LearnHub.sln

      - name: Build (warnings reported)
        run: dotnet build LearnHub.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test
          --solution LearnHub.sln
          --configuration Release
          --no-build
          --results-directory "$GITHUB_WORKSPACE/TestResults"
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx

      - name: Summarise test results
        if: always()
        run: |
          file=$(find TestResults -name 'test-results.trx' | head -n 1)
          if [ -z "$file" ]; then echo "No test results found." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          counters=$(grep -o '<Counters [^>]*>' "$file")
          get() { echo "$counters" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*'; }
          {
            echo "### Test results"
            echo "| Total | Passed | Failed |"
            echo "|------:|-------:|-------:|"
            echo "| $(get total) | $(get passed) | $(get failed) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 14
