name: Provision Azure

# Creates the Azure resources with infra/provision.sh from a GitHub-hosted runner, for team members without Azure
# Cloud Shell or a local Azure CLI. The runner starts an Azure device sign-in: download the "device-code" artifact
# while the run waits (or open the "Start Azure sign-in" step log once it finishes), enter the code at
# https://microsoft.com/devicelogin and sign in with the account that owns the subscription. No credential is stored.
#
# Non-secret results (app name, URL and the ids for the deployment variables) are uploaded as the
# "provision-outputs" artifact. Generated seed passwords go straight into the App Service settings and are never printed.

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Preferred Azure region (another allowed region is used if this one is unavailable)"
        required: true
        default: southeastasia
        type: string
      plan_sku:
        description: "App Service plan tier: F1 is free, B1 is paid"
        required: true
        default: F1
        type: choice
        options: [F1, B1]
      sql_tier:
        description: "Azure SQL tier: free uses the free offer, basic is paid"
        required: true
        default: free
        type: choice
        options: [free, basic]

permissions:
  contents: read

concurrency:
  group: provision-azure
  cancel-in-progress: false

jobs:
  provision:
    name: Provision Azure resources
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate inputs
        env:
          LOCATION: ${{ inputs.location }}
        run: |
          [[ "$LOCATION" =~ ^[a-z0-9]{3,30}$ ]] || { echo "::error::Region names are lower-case letters and digits, e.g. southeastasia."; exit 1; }

      - name: Install go-sqlcmd
        run: |
          curl -sSL -o "$RUNNER_TEMP/sqlcmd.tar.bz2" https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
          mkdir -p "$RUNNER_TEMP/sqlcmd"
          tar -xjf "$RUNNER_TEMP/sqlcmd.tar.bz2" -C "$RUNNER_TEMP/sqlcmd"
          echo "$RUNNER_TEMP/sqlcmd" >> "$GITHUB_PATH"

      - name: Start Azure sign-in
        run: |
          mkdir -p signin
          nohup az login --use-device-code --output none > signin/login.log 2>&1 &
          for attempt in $(seq 1 90); do
            if grep -qiE "devicelogin|enter the code" signin/login.log; then break; fi
            sleep 1
          done
          grep -oE "https://[^ ]+" signin/login.log | head -n 1 > signin/url.txt || true
          grep -oE "code [A-Z0-9]{6,}" signin/login.log | head -n 1 | awk '{print $2}' > signin/code.txt || true
          if [ ! -s signin/code.txt ]; then cat signin/login.log; echo "::error::No device code was issued."; exit 1; fi
          echo "Open $(cat signin/url.txt) and enter the code $(cat signin/code.txt)"

      - name: Share the sign-in code
        uses: actions/upload-artifact@v7
        with:
          name: device-code
          path: signin/*.txt
          retention-days: 1

      - name: Wait for sign-in (up to 14 minutes)
        run: |
          for attempt in $(seq 1 168); do
            if az account show --output none 2> /dev/null; then
              echo "Signed in to Azure."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The sign-in did not complete in time (or the account has no subscription). Run the workflow again."
          sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<id>/g' signin/login.log | tail -n 20
          exit 1

      - name: Provision
        env:
          LOCATION: ${{ inputs.location }}
          PLAN_SKU: ${{ inputs.plan_sku }}
          SQL_TIER: ${{ inputs.sql_tier }}
          QUIET_IDS: "true"
          PROVISION_OUTPUT_FILE: ${{ runner.temp }}/provision-outputs.env
        run: bash infra/provision.sh < /dev/null

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provision-outputs
          path: ${{ runner.temp }}/provision-outputs.env
          if-no-files-found: ignore
          retention-days: 1

      - name: Sign out of Azure
        if: always()
        run: az logout 2> /dev/null || true
