name: GitHub Pages

# Publishes the static project presentation site in docs/ (separate from the ASP.NET Core application).
# The "Launch LearnHub" buttons point at the AZURE_WEBAPP_URL repository variable once Azure is set up;
# until then they open the deployment guide. The site is republished after every deployment.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Deploy to Azure"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Point the launch buttons at the live application
        env:
          APP_URL: ${{ vars.AZURE_WEBAPP_URL }}
          FALLBACK_URL: https://github.com/${{ github.repository }}/blob/main/Documentation/Deployment.md
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          target="${APP_URL:-$FALLBACK_URL}"
          case "$target" in
            https://*) ;;
            *) echo "::error::AZURE_WEBAPP_URL must start with https://"; exit 1 ;;
          esac
          # Escape the characters sed treats specially in a replacement.
          escaped="$(printf '%s' "$target" | sed 's/[&|\\]/\\&/g')"
          sed -i "s|__LEARNHUB_APP_URL__|${escaped}|g" _site/index.html
          if grep -q "__LEARNHUB_APP_URL__" _site/index.html; then
            echo "::error::A launch button placeholder was not replaced."
            exit 1
          fi
          echo "Launch buttons point to $target"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
